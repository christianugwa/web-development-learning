<!DOCTYPE html>
<html>
  <head>
    <title>DOM projects</title>

    <style>

       body {
        font-family: arial;
      }


      .subscribe-button {
        border: none;
        background-color: black;
        color: white;
        padding: 10px 15px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        margin-bottom: 30px;
      }

      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

      .cost-input {
        font-size: 15px;
        padding: 10px 10px;
      }

      .calculate-button{
        background-color: green;
        padding: 12px 15px;
        color: white;
        border: none;
        font-size: 15px;
        cursor: pointer;
      }

      .error {
        color: red;
      }
     
    </style>

  </head>


  <body>

    <p>Youtube Subscribe button</p>

    <button onclick="
      subscribe();
    " class="js-subscribe-button subscribe-button">
      Subscribe
    </button>


    <p>Amazon Shipping Calculator</p>

    <input type="text" placeholder="Cost of Order"
    class="js-cost-input cost-input" onkeydown="handleCostKeydown(event)">
    

    <button onclick="calculateTotal()" class="calculate-button">
      Calculate
    </button>

    <p class="js-total-cost"></p>

   
    

    <script>
      function handleCostKeydown (event) {
        if (event.key === 'Enter') {
          calculateTotal();
        }
      }

      function calculateTotal () {
       const inputElement = document.querySelector('.js-cost-input');

       let cost = Number(inputElement.value);

       const totalParagraph = document.querySelector('.js-total-cost')       

       if (cost < 0) {
         totalParagraph.innerHTML = 'Error: cost cannot be less than $0';
         totalParagraph.classList.add('error');

       } else {
        if (cost < 40 && cost >= 0) {
          cost += 10;
        }
        totalParagraph.innerHTML = `$${cost}`;
        totalParagraph.classList.remove('error');
      }
     }




      function subscribe () {
        const buttonElement = document.querySelector('.js-subscribe-button');

        if (buttonElement.innerText === 'Subscribe' ) {
          buttonElement.innerHTML = 'Subscribed';
          buttonElement.classList.add('is-subscribed');
        } else {
          buttonElement.innerHTML = 'Subscribe';
           buttonElement.classList.remove('is-subscribed');
        }
      }

    
    </script>

  </body>
</html>
