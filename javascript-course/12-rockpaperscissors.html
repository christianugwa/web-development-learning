<!DOCTYPE html>
 <html>

  <head>

    <link rel="stylesheet" href="styles/12-rock-paper-scissors.css">

  </head>


  <body>

    <p class="title">Rock Paper Scissors</p>

    <button 
      class="move-button js-rock-button">
      <img src="Images-JAvascript/rock-emoji.png" class="move-icon">
    </button>

    <button 
      class="move-button js-paper-button">
      <img src="Images-JAvascript/paper-emoji.png" class="move-icon">
    </button>

    <button 
      class="move-button js-scissors-button">
      <img src="Images-JAvascript/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-score-button js-reset-score-button">
      Reset Score
    </button>

    <button class="auto-play-button js-auto-play-button" 
    ">Auto Play
    </button>

    <div class="js-question-div"></div>

    <script src="scripts/12-rock-paper-scissors.js"></script>
    

  </body>
 </html>
