<!DOCTYPE html>
<html>
  <head>


    <style>

      div {
        font-family: arial;
      }

      .container {
        width: 300px;
        border-width: 1px;
        border-style: solid;
        border-color: #ccc;
        border-radius: 5px;
      }


      .Home-notifications {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      padding-bottom: 6px;
      padding-left: 12px;
      padding-right: 12px;
      flex-direction: row;
    }

    .notifications {
      background-color: rgb(49, 109, 245);
      color: white;
      border-radius: 20px;
      padding-right: 10px;
      padding-left: 10px;
      padding-top: 3px;
      padding-bottom: 3px;
      font-size: 14px;
      font-weight: bold;
    }


    </style>

  </head>

  <body>

    <div class="container">
      <div class="Home-notifications">

       <div>Home</div>

       <div class="notifications">14</div>


      </div>

      <div class="Home-notifications">

       <div>Notifications</div>

       <div class="notifications">3</div>


      </div>

      <div class="Home-notifications">

       <div>Messages</div>

       <div class="notifications">5</div>


      </div>








    </div>



    
    
  </body>







</html>
