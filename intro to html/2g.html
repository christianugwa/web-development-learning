<!DOCTYPE html></html>
<style>
  .backtoamazon {
    color: rgb(0, 113, 133);
    transition: color 0.15s;
  }

  .backtoamazon:hover {
    color: red;
  }

.Nike {
  font-size: 20px;
  font-weight: bold;
}
.stock {
  color: rgb(0, 118, 0);
  font-weight: 700;
}

.cart {
  background-color: rgb(255, 216, 20);
  height: 30px;
  width: 90px;
  border: none;
  border-radius: 15px;
  margin-right: 8px;
  cursor: pointer;
}

.cart:active {
  opacity: 0.7;
}

.buy {
  background-color: rgb(255, 164, 28);
  height: 30px;
  width: 90px;
  border: none;
  border-radius: 15px;
  margin-right: 8px;
  cursor: pointer;
}

.buy:active {
  opacity: 0.7;
}

</style>



<a class="backtoamazon" href="www.amazon.com" target="_blank">
  Back to Amazon
</a>

<p class="Nike">Nike Black Running Shoes</p>

<p>Free delivery tomorrow</p>
