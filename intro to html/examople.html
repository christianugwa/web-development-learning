<!DOCTYPE html>


<html>
  <head>
    <style>
      .images {
        width: 50px;
        height: 50px;
        border-radius: 25px;
        object-position: center;
        object-fit: cover;
        vertical-align: middle;
        margin-right: 5px;
      }

      .tweetinput {
        width: 300px;
        height: 30px;
        border-radius: 15px;
        padding: 5px 10px;
        font-size: 18px;
        border: none;
        margin-right: 10px;
        vertical-align: middle;
      }

      .tweetbutton {
        width: 100px;
        height: 30px;
        border-radius: 15px;
        padding: 5px 10px;
        font-size: 14px;
        background-color: #1da1f2;
        color: #fff;
        border: 1px solid #1da1f2;
      }




    </style>

  </head>

  <body>

    <img class="images"  src="WhatsApp Image 2025-03-05 at 14.27.26_adf5cc57.jpg" alt="">

    <input class="tweetinput" type="text" placeholder="What's Happening?">

    <button class="tweetbutton">
      Tweet
    </button>
    


  </body>




</html>
