<!DOCTYPE html>
<html>
  <head>

    <style>
      .father {
        border: none;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
        display: inline-block;
        padding-right: 20px;
        padding-left: 5px;
        padding-top: 5px;
        padding-bottom: 5px;
        border-radius: 5px;
      }



      .lion {
      width: 50px;
      border-radius: 25px;
      object-position: center;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
     }

      .text {
        color: rgb(94, 94, 94);
        font-family: arial;
        font-size: 18px;
        border: none;
        width: 200px;
        vertical-align: middle;

      }

      .tweetbutton {
        color: white;
        border: none;
        background-color: rgba(0, 132, 255, 0.795);
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 18px;
        padding-right: 18px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        font-family: arial;
        vertical-align: middle;
        margin-left: 65px;

      }



    </style>

    




  </head>

  <body>

    <div class="father">

      <img class="lion" src="images/lion-animal-isolated-photo.jpg">

      <input type="text" class="text" placeholder="What's happening?">

      <button class="tweetbutton">Tweet</button>



    </div>

    

    



  </body>



</html>
