<!DOCTYPE html>

<html>

<head>


  <style>

    .container {
      background-color: gray;
      width: 200px;
      height: 200px;
      position: relative;
      display: inline-block;
    }

    img {
      width: 200px;
      height: 200px;
      object-fit: cover;
    }

    .discount {
      background-color: black;
      color: white;
      position: absolute;
      top: 10px;
      right: 0;
      font-family: arial;
      padding-left: 12px;
      padding-right: 12px;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    .button-overlay {
      background-color: rgba(255, 255, 255, 0.8);
      width: 200px;
      height: 50px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;

    }


  </style>

</head>

<body>

  <div class="container">

    <img src="images/light-blue-classic-shirt.webp" alt="">

    <div class="discount">20% OFF</div>

    <div class="button-overlay">
      <button>Add to Cart</button>
    </div>


  </div>
  



</body>









</html>
