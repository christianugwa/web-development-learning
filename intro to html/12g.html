<!DOCTYPE html>

<html>

<head>

  <style>

    p {
      font-family: Arial;
      margin-bottom: 0;
      margin-top: 0;
    }
  
    .row {
      display: flex;
      flex-direction: row;
      align-items: center;
      margin-bottom: 20px;
    }

    .images {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 25px;
      margin-right: 15px;


    }

    .textdiv {
      width: 200px;

    }

    .boldname {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .name {
      color: gray;
      margin-bottom: 10px;
    }

    .category {
      color: gray;
      font-size: 14px;

    }

    button {
      background-color: #1DA1F2;
      color: white;
      border: none;
      cursor: pointer;
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: 15px;
      padding-right: 15px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 5px;
    }








  </style>


</head>

<body>

  <div class="row">

    <img class="images" src="images/Dog 1.webp" alt="">

    <div class="textdiv">
      <p class="boldname">oliver</p>
      <p class="name">the cat</p>
      <p class="category">Popular</p>
    </div>

    <button>Follow</button>


  </div>

  
  <div class="row">

    <img class="images" src="images/dog 2.avif" alt="">

    <div class="textdiv">
      <p class="boldname">Mimi</p>
      <p class="name">Sleepy cat</p>
      <p class="category">Popular</p>
    </div>

    <button>Follow</button>


  </div>

  
  <div class="row">

    <img class="images" src="images/dog 3.jfif" alt="">

    <div class="textdiv">
      <p class="boldname">Rex</p>
      <p class="name">Happy bulldog</p>
      <p class="category">Popular</p>
    </div>

    <button>Follow</button>


  </div>
  


</body>





</html>
