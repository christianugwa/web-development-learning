<!DOCTYPE html>
<html>
  
<head>

  <style>

    div {
      font-family: arial;

    }

    .container {
      display: flex;
      flex-direction: row;
      margin-top: 20px;
      margin-left: 20px;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-right: 15px;
      padding-left: 15px;
      width: 400px;
      
    }

    .other-half {
      margin-left: 15px;
      flex: 1;
    }

    .image {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      object-fit: cover;

    }

    .topic {
      width: 400px;
      line-height: 19px;
    }

    .username {
      font-weight: bold;
      margin-bottom: 3px;
    }

    span {
      color: rgb(120, 120, 120);
    }

    .bottom {
      display: flex;
      margin-top: 10px;
      border-radius: 15px;
      align-items: center;
      height: 90px;
      border-style: solid;
      border-width: 1px;
      border-color: rgb(200, 200, 200);
      width: 345px;
    }

    .empty {
      background-color: rgb(195, 195, 195);
      width: 85px;
      height: 90px;
      border-top-left-radius: 15px;
      border-bottom-left-radius: 15px;
      

    }

    .backend {
      width: 250px;
    }

    .youtube-section {
      margin-left: 10px;
    }

    .youtube-text {
      color: rgb(120, 120, 120);
      margin-bottom: 5px;
    }




  </style>

</head>

<body>

  <div class="container">

    <div>
      <img class="image" src="images/Dog 1.webp" alt="">
    </div>


    <div class="other-half">

      <div class="username">supersimple.dev <span>@Supersimple.dev</span> </div>

      <div class="topic">
       What is backend web development? A complete overview. New video is up!
      </div>

    

      <div class="bottom">

        <div class="empty"></div>

        <div class="youtube-section">
          <div class="youtube-text">youtube.com</div>
          <div class="backend">Backend web development - a complete overview (2021)</div>
        </div>

      </div>

     


    </div>



  </div>

  

</body>





</html>
