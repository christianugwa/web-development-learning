<!DOCTYPE html>
<html>

<head>

  <style>
    p {
      font-family: arial;
    }


    .profile-picture {
      width: 150px;
      height: 150px;

    }

    .profile-name {
      font-weight: Bold;
      font-size: 20px;
      object-fit: cover;
      margin-top: 0;
      margin-bottom: 0;
      margin-left: 5px;
    }

    .image {
      width: 30px;
      border-radius: 50%;
    }

    .friends {
      color: rgb(96, 96, 96);
      margin-right: 5px;
      font-size: 13px;
    }

    button {
      color: white;
      background-color: #1877f2;
      border-style: solid;
      border: none;
      padding-bottom: 8px;
      padding-top: 8px;
      padding-left: 15px;
      padding-right: 15px;
      border-radius: 5px;
      margin-left: 5px;
      margin-bottom: 10px;
      margin-top: 5px;
    }

    .father {
      border-style: solid;
      border: none;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
    
    }

    .troll {
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      column-gap: 5px;
    }

    .godfather {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 20px;
      width: 150px;
    }








  </style>

</head>
