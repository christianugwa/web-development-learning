<!DOCTYPE html>
<html>
  <head>

    <title>GMAIL IOS Clone</title>

    <style>

      .papa {
        border: none;
        padding-top: 10px;
        padding-left: 15px;
        padding-right: 15px;
        padding-bottom: 10px;
        width: 400px;
        border-radius: 4px;
        box-shadow: 0px 0px 5px 0px rgba(0, 0, 0, 0.2);
        margin-top: 20px;
        margin-left: 20px;
      }

      div {
        margin: 0;
        font-family: Arial;
      }

      .inbox {
        color: rgb(120, 120, 120);
        font-size: 14px;
        margin-bottom: 20px;
      }

      .row1 {
        display: flex;
        flex-direction: row;
        align-items: center;
        margin-bottom: 20px;
      }

      .image-container {
        margin-right: 10px;
      }

      .image {
        width: 50px;
        height: 50px;
        object-fit: cover;
        border-radius: 25px;
      }

      .textarea {
        flex : 1; 
      }

      .hastime {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-direction: row;
        margin-bottom: 3px;
      }

      .chewy {
        font-weight: bold;
        font-size: 18px;
      }

      .baby {
        color: rgb(120, 120, 120);
        font-size: 14px;
      }

      .subject {
        font-weight: bold;
        margin-bottom: 5px;
      }

      .message {
        color: rgb(120, 120, 120);
      }

    </style>



  </head>



  <body>
    <div class="papa">

      <div class="inbox">ALL INBOXES</div>  

      <div class="row1">

        <div class="image-container">
          <img class="image" src="images/Dog 1.webp" alt="">
        </div>

        <div class="textarea">
          <div class="hastime">
            <div class="chewy">Chewy Promotions</div>
            <div class="baby">4:58 PM</div>
          </div>

          <div class="subject">Biggest sales of the year!</div>

          <div class="message">Hey there! We're writing to tell you about our...</div>

        </div>

      </div>

      <div class="row1">

        <div class="image-container">
          <img class="image" src="images/dog 2.avif" alt="">
        </div>

        <div class="textarea">
          <div class="hastime">
            <div class="chewy">Best Buy</div>
            <div class="baby">12:32 PM</div>
          </div>

          <div class="subject">Your Best Buy receipt</div>

          <div class="message">Thank you for shopping at Best Buy, here is...</div>

        </div>

      </div>

      <div class="row1">

        <div class="image-container">
          <img class="image" src="images/dog 3.jfif" alt="">
        </div>

        <div class="textarea">
          <div class="hastime">
            <div class="chewy">Netflix</div>
            <div class="baby">9:00 AM</div>
          </div>

          <div class="subject">Here's what's coming soon to Netflix</div>

          <div class="message">Brand new movies and shows, old favorites...</div>

        </div>

      </div>

       
        

        





      </div>


















    </div>
    





  </body>
</html>
